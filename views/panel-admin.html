<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel Admin — Kairoo Store</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="/assets/logo.png" />
</head>
<body>
  <div class="toast-wrap" id="toastWrap"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-ring"><img src="/assets/logo.png" alt="Kairoo Store" /></div>
        <div>
          <div class="name">KAIROO STORE</div>
          <div class="role-tag">ADMIN PANEL</div>
        </div>
      </div>

      <a class="nav-link" href="/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r=".6" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r=".6" fill="currentColor" stroke="none"/></svg><span>Buat Panel</span></a>
      <a class="nav-link active" href="/panel-admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="1.8"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="1.8"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="1.8"/></svg><span>Panel Admin</span></a>
      <a class="nav-link" href="/profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg><span>Profil</span></a>

      <div class="nav-spacer"></div>
      <div class="nav-link logout" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></svg><span>Logout</span></div>
    </aside>

    <main class="main">
      <button class="hamburger" id="hamburger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg><span>Menu</span></button>
      <div class="topbar">
        <div>
          <h1>Panel Admin</h1>
          <p>Ringkasan aktivitas pembuatan panel milikmu</p>
        </div>
      </div>

      <div class="grid grid-3" id="statGrid">
        <div class="card stat-card">
          <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r=".6" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r=".6" fill="currentColor" stroke="none"/></svg></div>
          <div class="label">Total Panel Dibuat</div><div class="value" id="statTotal">-</div>
        </div>
        <div class="card stat-card">
          <div class="stat-icon" style="background:var(--success-glow); color:#5eeab5;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
          <div class="label">Berhasil</div><div class="value" id="statSuccess">-</div>
        </div>
        <div class="card stat-card">
          <div class="stat-icon" style="background:var(--danger-glow); color:#ff8a97;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg></div>
          <div class="label">Gagal</div><div class="value" id="statFailed">-</div>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nama Panel</th><th>RAM</th><th>Status</th><th>Dibuat</th><th>Link</th></tr></thead>
            <tbody id="riwayatBody"><tr><td colspan="5"><div class="skeleton" style="height:16px;"></div></td></tr></tbody>
          </table>
        </div>
        <div class="empty-state" id="riwayatEmpty" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l3-7h12l3 7"/><path d="M3 12v6a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-6"/><path d="M3 12h5.5a2.5 2.5 0 0 0 5 0H21"/></svg>Belum ada panel yang dibuat.</div>
      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/panel-admin.js"></script>
</body>
</html>
