<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelola Akun — Kairoo Store</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="/assets/logo.png" />
</head>
<body>
  <div class="toast-wrap" id="toastWrap"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-ring"><img src="/assets/logo.png" alt="Kairoo Store" /></div>
        <div>
          <div class="name">KAIROO STORE</div>
          <div class="role-tag">WEB ADMIN</div>
        </div>
      </div>

      <a class="nav-link" href="/web-admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/></svg><span>Dashboard</span></a>
      <a class="nav-link active" href="/web-admin/accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2.5 19c1.1-3.2 3.6-5 6.5-5s5.4 1.8 6.5 5"/><circle cx="17" cy="8" r="2.5"/><path d="M16 13.2c2.2.4 3.8 1.9 4.6 4.3"/></svg><span>Kelola Akun</span></a>
      <a class="nav-link" href="/web-admin/monitoring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.2-7 4 14 2-7H21"/></svg><span>Monitoring</span></a>
      <a class="nav-link" href="/web-admin/panel-logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg><span>Log Panel</span></a>
      <a class="nav-link" href="/web-admin/settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.4 7.4 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.6-1.5L14 2h-4l-.5 2.4a7.6 7.6 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.4 7.4 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9c.75.65 1.63 1.16 2.6 1.5L10 22h4l.5-2.4a7.6 7.6 0 0 0 2.6-1.5l2.3.9 2-3.4-2-1.5Z"/></svg><span>Pengaturan</span></a>
      <a class="nav-link" href="/profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg><span>Profil</span></a>

      <div class="nav-spacer"></div>
      <div class="nav-link logout" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></svg><span>Logout</span></div>
    </aside>

    <main class="main">
      <button class="hamburger" id="hamburger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg><span>Menu</span></button>
      <div class="topbar">
        <div>
          <h1>Kelola Akun</h1>
          <p>Buat & kelola akun reseller dan admin panel</p>
        </div>
        <button class="btn" style="width:auto;" id="openCreateModal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Buat Akun
        </button>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Dibuat</th><th>Login Terakhir</th><th>Aksi</th></tr></thead>
            <tbody id="accBody"><tr><td colspan="6"><div class="skeleton" style="height:16px;"></div></td></tr></tbody>
          </table>
        </div>
        <div class="empty-state" id="accEmpty" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l3-7h12l3 7"/><path d="M3 12v6a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-6"/><path d="M3 12h5.5a2.5 2.5 0 0 0 5 0H21"/></svg>Belum ada akun.</div>
      </div>
    </main>
  </div>

  <!-- Modal buat akun -->
  <div class="modal-overlay" id="createModal">
    <div class="modal-box">
      <h3 style="display:flex; align-items:center; gap:9px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px;color:var(--accent-2);"><circle cx="9" cy="8" r="3"/><path d="M2.5 19c1.1-3.2 3.6-5 6.5-5s5.4 1.8 6.5 5"/><circle cx="17" cy="8" r="2.5"/><path d="M16 13.2c2.2.4 3.8 1.9 4.6 4.3"/></svg>
        Buat Akun Baru
      </h3>
      <form id="createAccForm" class="form-grid">
        <div>
          <label style="font-size:13px; color:var(--text-dim); display:block; margin-bottom:6px;">Username</label>
          <input type="text" id="accUsername" required />
        </div>
        <div>
          <label style="font-size:13px; color:var(--text-dim); display:block; margin-bottom:6px;">Role</label>
          <select id="accRole" required>
            <option value="reseller">Reseller</option>
            <option value="admin_panel">Admin Panel</option>
          </select>
        </div>
        <div>
          <label style="font-size:13px; color:var(--text-dim); display:block; margin-bottom:6px;">Password</label>
          <select id="accMode">
            <option value="auto">Generate otomatis</option>
            <option value="manual">Set manual</option>
          </select>
        </div>
        <div id="manualPassField" style="display:none;">
          <input type="text" id="accPassword" placeholder="Password manual" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelCreateAcc">Batal</button>
          <button type="submit" class="btn" id="createAccBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Buat
          </button>
        </div>
      </form>
      <div class="result-box" id="accResultBox" style="display:none;"></div>
    </div>
  </div>

  <!-- Modal konfirmasi hapus -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
      <h3>Hapus Akun?</h3>
      <p id="deleteText">Tindakan ini tidak dapat dibatalkan.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelDelete">Batal</button>
        <button class="btn btn-danger" id="confirmDelete">Hapus</button>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/web-admin-accounts.js"></script>
</body>
</html>
