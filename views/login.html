<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Kairoo Store</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="/assets/logo.png" />
</head>
<body>
  <div class="grid-field"></div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-ring"><img src="/assets/logo.png" alt="Kairoo Store" /></div>
        <div class="site-name">CPANEL KAIROO STORE</div>
        <div class="site-sub">PANEL MANAGER</div>
      </div>

      <div id="errorBox" class="error-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.3" r=".9" fill="currentColor" stroke="none"/></svg>
        <span id="errorText"></span>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-group">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>
            <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required />
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-group">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required />
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn" id="submitBtn">
          <span id="submitText">MASUK</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5l7 7-7 7"/><path d="M20 12H4"/></svg>
        </button>
      </form>

      <div class="login-footer">
        Tidak mempunyai akses login?
        <a href="#" id="openWaRequest" style="color:var(--accent-2); font-weight:600;">Klik di sini</a>
      </div>
    </div>
  </div>

  <!-- Modal permintaan akses via WhatsApp -->
  <div class="modal-overlay" id="waModal">
    <div class="modal-box">
      <h3 style="display:flex; align-items:center; gap:9px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px;color:var(--accent-2);"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L4 20l1-4.4A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8.5 10.5c.3 2.5 2.5 4.7 5 5"/></svg>
        Ajukan Akses Login
      </h3>
      <p>Isi data berikut, lalu pesan akan disiapkan otomatis untuk dikirim ke Admin lewat WhatsApp.</p>
      <form id="waForm" class="form-grid">
        <div>
          <label for="waName">Nama</label>
          <input type="text" id="waName" placeholder="Nama lengkap kamu" required />
        </div>
        <div>
          <label for="waUsername">Username yang diinginkan</label>
          <input type="text" id="waUsername" placeholder="Contoh: budi_reseller" required />
        </div>
        <div>
          <label for="waRole">Role</label>
          <select id="waRole" required>
            <option value="RESELLER">Reseller</option>
            <option value="ADMIN PANEL">Admin Panel</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelWaRequest">Batal</button>
          <button type="submit" class="btn" id="sendWaBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L4 20l1-4.4A8.5 8.5 0 1 1 21 11.5Z"/></svg>
            Kirim via WhatsApp
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/wa-request.js"></script>
</body>
</html>
