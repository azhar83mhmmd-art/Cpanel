<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profil — Kairoo Store</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="/assets/logo.png" />
</head>
<body>
  <div class="toast-wrap" id="toastWrap"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-ring"><img src="/assets/logo.png" alt="Kairoo Store" /></div>
        <div>
          <div class="name">KAIROO STORE</div>
          <div class="role-tag" id="roleTag">-</div>
        </div>
      </div>

      <div class="nav-link" id="backLink" style="cursor:pointer;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg><span>Kembali</span></div>
      <div class="nav-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg><span>Profil</span></div>

      <div class="nav-spacer"></div>
      <div class="nav-link logout" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></svg><span>Logout</span></div>
    </aside>

    <main class="main">
      <button class="hamburger" id="hamburger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg><span>Menu</span></button>
      <div class="topbar">
        <div>
          <h1>Profil Saya</h1>
          <p>Kelola informasi akun</p>
        </div>
      </div>

      <div class="grid grid-2">
        <div class="card">
          <h3 style="margin-top:0;">Informasi Akun</h3>
          <div class="result-box" id="infoBox"></div>
        </div>

        <div class="card">
          <h3 style="margin-top:0;">Ganti Password</h3>
          <form id="passForm" class="form-grid">
            <input type="password" id="newPass" placeholder="Password baru (min. 8 karakter)" minlength="8" required />
            <input type="password" id="confirmPass" placeholder="Ulangi password baru" minlength="8" required />
            <button type="submit" class="btn" id="passBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              Simpan Password
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
